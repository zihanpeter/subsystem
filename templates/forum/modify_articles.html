{% extends 'base.html' %}
{% set active_nav = 'forum' %}

{% block title %}{{ t_title }} - Modify - Forum - Subsystem{% endblock %}

{% block content %}
<div class="stack">
    <div class="page-head">
        <div>
            <span class="page-head__eyebrow">Forum</span>
            <h1>Modify article</h1>
            <p class="page-head__sub">
                Supports
                <a href="https://help.luogu.com.cn/rules/academic/handbook/markdown" target="_blank" rel="noopener">Markdown</a>
                and
                <a href="https://katex.org/docs/supported.html" target="_blank" rel="noopener">KaTeX</a>.
            </p>
        </div>
    </div>

    <section class="card">
        <form class="form" action="/modifier_articles" method="post">
            <div class="field">
                <label class="field__label" for="article-title">Title</label>
                <input id="article-title" type="text" name="title" value="{{ t_title }}"
                       placeholder="Title" maxlength="64" required>
            </div>

            <div class="field field--code">
                <label class="field__label" for="article-content">Content</label>
                <textarea id="article-content" name="content" placeholder="Contents"
                          maxlength="8000" required>{{ t_info }}</textarea>
            </div>

            {% if t_admin %}
            <div class="field">
                <label class="field__label" for="article-top">Visibility</label>
                <select id="article-top" name="top">
                    <option value="True">Pinned</option>
                    <option value="False">Not pinned</option>
                </select>
            </div>
            {% endif %}

            <input type="hidden" name="id" value="{{ t_id }}">

            <div class="field">
                <label class="field__label" for="article-captcha">Validate code</label>
                <div class="captcha">
                    <img src="data:image/png;base64,{{ t_captcha_image | safe }}" alt="Captcha">
                    <input id="article-captcha" type="text" name="user_captcha" placeholder="4 characters"
                           maxlength="4" autocomplete="off" required>
                </div>
            </div>

            <p class="error">{{ t_error }}</p>

            <div class="form__actions">
                <button class="btn" type="submit">Save changes</button>
                <a class="btn btn--ghost" href="/articles?id={{ t_id }}">Cancel</a>
            </div>
        </form>
    </section>
</div>
{% endblock %}
