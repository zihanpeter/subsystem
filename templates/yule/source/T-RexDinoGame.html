<!DOCTYPE html>
<html lang="en" data-theme="{{ 'dark' if t_theme == 'black' else 'light' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T-Rex Dino Game</title>
    {% include 'partials/favicon.html' %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/yule/trex.css') }}">
    <link href="{{ url_for('static', filename='css/white_theme_yule.css') }}" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tokens.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/ui.css') }}">
</head>
<body>
    {% include 'partials/game_header.html' %}
    <div id="game">
        <div id="trex"></div>
        <div id="score">Score: 0</div>
    </div>

    <div id="instructions" style="text-align: center; margin-top: 20px;">
        <h2>操作说明</h2>
        <p>按 <strong>空格键</strong> 让小恐龙跳跃，避开飞来的仙人掌！</p>
        <p>尽量收集分数，看看你能跑多远！</p>
        <p>祝你好运，勇敢的飞行员！🌟</p>
    </div>
    {% include 'partials/game_footer.html' %}
    <script src="{{ url_for('static', filename='javascript/yule/trex.js') }}"></script>
</body>
</html>
