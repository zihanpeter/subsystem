<!DOCTYPE html>
<html lang="en" data-theme="{{ 'dark' if t_theme == 'black' else 'light' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bouncing Ball Game</title>
    {% include 'partials/favicon.html' %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/yule/pinball.css') }}">
    <link href="{{ url_for('static', filename='css/white_theme_yule.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/black_theme.css') }}" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tokens.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/ui.css') }}">
</head>
<body>
    {% include 'partials/game_header.html' %}
    <div id="gameContainer">
        <div id="score">Score: <span id="scoreValue">0</span></div>
        <div id="healthContainer">
            <div id="healthBar"></div>
        </div>
        <canvas id="gameCanvas" width="800" height="400"></canvas>
        <button id="startButton">Start Game</button>
    </div>
    {% include 'partials/game_footer.html' %}
    <script src="{{ url_for('static', filename='javascript/yule/pinball.js') }}"></script>
</body>
</html>
