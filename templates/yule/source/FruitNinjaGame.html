<!DOCTYPE html>
<html lang="zh" data-theme="{{ 'dark' if t_theme == 'black' else 'light' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FruitNinjGame</title>
    {% include 'partials/favicon.html' %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/yule/fruitNinja.css') }}">
    <link href="{{ url_for('static', filename='css/white_theme_yule.css') }}" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tokens.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/ui.css') }}">
</head>
<body>
    {% include 'partials/game_header.html' %}
    <div class="game-info">
        <div class="score">Score: <span id="score">0</span></div>
        <div id="healthContainer">
            <div id="healthBar"></div>
        </div>
    </div>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    {% include 'partials/game_footer.html' %}
    <script src="{{ url_for('static', filename='javascript/yule/fruitNinja.js') }}"></script>
</body>
</html>
