services:
  app:
    build: .
    container_name: subsystem-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./secrets:/app/secrets:ro
    expose:
      - "5050"

  mysql:
    image: mysql:8.0
    container_name: subsystem-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      MYSQL_DATABASE: subsystem
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    secrets:
      - mysql_root_password
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$(cat /run/secrets/mysql_root_password) --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: subsystem-cloudflared
    restart: unless-stopped
    depends_on:
      - app
    env_file:
      - ./secrets/cloudflared.env
    command: tunnel --no-autoupdate run

secrets:
  mysql_root_password:
    file: ./secrets/mysql_password.txt

volumes:
  mysql_data:
